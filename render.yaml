# Render Blueprint — https://render.com/docs/blueprint-spec
# This mirrors the manual Web Service setup already configured in the Render
# dashboard. Using this file is optional: it's only needed if you want to
# recreate this environment from scratch (e.g. a staging copy) via
# "New > Blueprint" instead of clicking through the dashboard again.
#
# This assumes you're keeping your existing external Postgres (e.g. Neon) —
# DATABASE_URL is marked sync: false so you paste it in the dashboard rather
# than having Render provision its own database. If you'd rather have Render
# manage Postgres too, see the commented-out `databases:` block at the
# bottom of this file.

services:
  - type: web
    runtime: node
    name: alfawz-academy
    plan: starter # change to "free" to match a free-tier Web Service
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # --- Database ---
      - key: DATABASE_URL
        sync: false # paste your Neon (or other Postgres) connection string

      # --- Auth.js ---
      - key: AUTH_SECRET
        sync: false # paste the value already generated in the Render dashboard
      - key: NEXTAUTH_URL
        sync: false # set to your Render URL, e.g. https://alfawz-academy.onrender.com

      # --- Paystack ---
      - key: PAYSTACK_SECRET_KEY
        sync: false # use your LIVE secret key here, never paste it into this file
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false

      # --- Email (Resend) ---
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: "AlFawz Academy <noreply@alfawzacademy.com>"

      # --- App ---
      - key: NEXT_PUBLIC_APP_URL
        sync: false # same value as NEXTAUTH_URL above
      - key: NEXT_PUBLIC_WHATSAPP_NUMBER
        sync: false

      - key: NODE_VERSION
        value: "20"

      # --- Cloudinary (signed, server-side uploads) ---
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # --- Payment reminder cron ---
      # Shared secret the cron job below sends as a Bearer token. Render
      # generates one value here and the cron service pulls the same value
      # via fromService, so they always stay in sync with each other.
      - key: CRON_SECRET
        generateValue: true

  # Periodically emails students whose Enrollment is still PENDING (they
  # registered but haven't completed payment) a reminder to finish checkout.
  # Hits the web service's own protected API route rather than running its
  # own copy of the app, so there's nothing extra to build here — just curl,
  # which is preinstalled on Render's runner images.
  - type: cron
    runtime: node
    name: alfawz-academy-payment-reminders
    plan: starter
    region: oregon
    branch: main
    schedule: "0 */6 * * *" # every 6 hours; adjust in the Render dashboard if you want a different cadence
    buildCommand: "echo 'no build needed'"
    startCommand: >
      curl -fsS -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      "$APP_URL/api/cron/payment-reminders"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: alfawz-academy
          envVarKey: CRON_SECRET
      - key: APP_URL
        sync: false # same value as NEXT_PUBLIC_APP_URL on the web service

  # Emails registered students who have never enrolled in any course at all
  # (a different gap from the pending-payment reminder above). Throttled to
  # once a week per student inside the route itself, so checking every 6
  # hours here just means most runs find nothing new to send — harmless.
  - type: cron
    runtime: node
    name: alfawz-academy-enrollment-reminders
    plan: starter
    region: oregon
    branch: main
    schedule: "0 */6 * * *" # adjust in the Render dashboard if you want a different cadence
    buildCommand: "echo 'no build needed'"
    startCommand: >
      curl -fsS -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      "$APP_URL/api/cron/enrollment-reminders"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: alfawz-academy
          envVarKey: CRON_SECRET
      - key: APP_URL
        sync: false # same value as NEXT_PUBLIC_APP_URL on the web service

  # Emails every actively-enrolled student a one-time "your classes start
  # on..." notice (date, time, duration, schedule) once a course's
  # classStartsAt falls inside the notify window (lib/class-commencement-
  # notifications.ts). Idempotent per enrollment via commencementNotifiedAt,
  # so checking every 6 hours just means most runs find nothing new.
  - type: cron
    runtime: node
    name: alfawz-academy-class-commencement
    plan: starter
    region: oregon
    branch: main
    schedule: "0 */6 * * *" # adjust in the Render dashboard if you want a different cadence
    buildCommand: "echo 'no build needed'"
    startCommand: >
      curl -fsS -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      "$APP_URL/api/cron/class-commencement"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: alfawz-academy
          envVarKey: CRON_SECRET
      - key: APP_URL
        sync: false # same value as NEXT_PUBLIC_APP_URL on the web service

# Uncomment this block instead if you'd rather have Render provision and
# manage Postgres for you, then change DATABASE_URL above to:
#   - key: DATABASE_URL
#     fromDatabase:
#       name: alfawz-academy-db
#       property: connectionString
#
