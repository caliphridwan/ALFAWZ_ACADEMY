services:
  - type: web
    name: alfawz-academy
    runtime: node
    plan: free

    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_VERSION
        value: 20

      - key: DATABASE_URL
        sync: false

      - key: NEXTAUTH_SECRET
        sync: false

      - key: NEXTAUTH_URL
        sync: false

      - key: RESEND_API_KEY
        sync: false